<!DOCTYPE html>
<!--
  Fixture reproducing the real CAS login page layout, captured 2026-09-25.

  The real page is:
    <iframe id="loginIframe" src=".../login-normal.html">   ← full viewport, holds the
                                                              real (pretty) login UI
    <div id="default" style="display:none"> … <form id="loginForm">
                                          ↑ the built-in fallback ("compatibility view")

  When login-normal.html fails (HTTP 400, blocked by the site's bot protection in
  any automated browser), the iframe becomes an empty sheet of glass that both
  COVERS and, being in normal flow, PUSHES DOWN the fallback form. That is what
  made the manual-login window appear completely blank.

  This fixture points the iframe at an empty file so the "broken iframe" case can
  be reproduced offline, with no network access.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>统一身份认证</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  /* Full-viewport iframe, exactly like /authserver/css/index.css makes it. */
  #loginIframe { display: block; width: 100vw; height: 100vh; border: 0; }
  .container { width: 100%; max-width: 1170px; margin: 0 auto; }
  .border { border: 1px solid #ddd; border-radius: 6px; padding: 24px; box-sizing: border-box; }
  .system { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .service { color: #888; margin-bottom: 14px; }
  .form-group { margin-bottom: 14px; }
  .form-control { width: 100%; height: 34px; box-sizing: border-box; padding: 0 8px; }
  .btn-login { width: 100%; height: 35px; cursor: pointer; }
  label span { display: block; margin-bottom: 4px; color: #666; }
</style>
</head>
<body style="background-color: grey;">
  <!-- The src file is intentionally empty: this reproduces the failed iframe. -->
  <iframe id="loginIframe" src="cas-iframe-empty.html"></iframe>

  <div id="default" class="container" style="display: none;">
    <div class="border">
      <div class="system">统一身份认证</div>
      <div class="service" id="targetSystem">信息门户</div>
      <div class="service" id="targetSystemDescription" style="display: none;">信息门户</div>
      <form method="post" id="loginForm">
        <div class="form-group">
          <label><span>用户名</span><input type="text" class="form-control" name="username"></label>
        </div>
        <div class="form-group">
          <label><span>密码</span><input type="password" class="form-control" name="password" autocomplete="off"></label>
        </div>
        <div class="form-group" style="display: none;" id="captchaParent">
          <label><span style="display: none;" id="captchaLabel">验证码</span><div id="captchaDiv"></div></label>
        </div>
        <div class="form-group">
          <input class="btn btn-login" type="submit" name="submit" value="登录">
        </div>
        <div style="display: none;">
          <input name="type" value="username_password">
          <input name="execution" value="fixture-execution-token">
          <input name="_eventId" value="submit">
        </div>
      </form>
      <div class="service">此页面为兼容性视图 请使用Chrome等现代浏览器以获取最佳体验</div>
    </div>
  </div>

  <!-- doLogin() is defined by an inline script on the real page; mirror it so the
       auto-login contract (fill #loginForm + click submit) can be exercised too. -->
  <script>
    var firstLogin = true;
    function doLogin(username, password, type, captcha) {
      if (firstLogin) firstLogin = false; else return;
      var f = document.getElementById('loginForm');
      f.querySelector("input[name='username']").value = username;
      f.querySelector("input[name='password']").value = password;
      f.querySelector("input[name='type']").value = type;
      if (captcha) {
        var c = f.querySelector("input[name='captcha']");
        if (c) c.value = captcha;
      }
      f.querySelector("input[name='submit']").click();
    }
    function getPageConfig() { return { locale: 'zh_cn', captcha: null }; }
  </script>
</body>
</html>
