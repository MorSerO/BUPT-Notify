<!--
  test/fixtures/mail-list-unread.html

  Shape of a Coremail `mail_list` page as returned for
  /cgi-bin/mail_list?...&flag=new  (the unread filter).

  NOT a saved copy of a real page: every message, address and id below is
  invented. The structure is what matters, and it is the structure that broke
  the first parser attempt:

    * `<input name="mailid" type="hidden" value="">` form helpers appear BEFORE
      the real rows. Matching `name="mailid"` catches them and reports phantom
      messages, so the parser must require a non-hidden input with a real id.
    * Subjects live in `<u role="link">`, the preview snippet in `<b class="no">`.
    * The received time is in the `totime` attribute (epoch ms), not in the
      「9月24日」 text.
  -->
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"></head><body>
<form id="frmSort" name="frmSort" method="get" action="/cgi-bin/mail_list?sid=FIXTURE-SID,0" target="mainFrame" style="margin:0;padding:0">
<input type="hidden" name="sid" value="FIXTURE-SID,0" >
<input type="hidden" name="s" value="">
<input type="hidden" name="page" value=0>
</form>
<form id="star_frm" name="star_frm" method="post" target="actionFrame" action="/cgi-bin/mail_mgr?sid=FIXTURE-SID,0" >
<input name="mailid" type="hidden" value="" />
<input name="status" type="hidden" value="false" />
<input name="flag" type="hidden" value="star" />
</form>
<div class="txt_title"><div class="somail" id="somail"></div>
收件箱<span id="_ut" class="f_size normal black">(共 <span id="_ut_c">2</span> 封<span id="_ua" >，其中 <span id="_ur"><a href="/cgi-bin/mail_list?sid=FIXTURE-SID,0&amp;s=unread&amp;folderid=1&amp;flag=new&amp;page=0&amp;topmails=0" class="green">未读邮件</a> <span id="_ur_c">2</span> 封</span></span>)</div>
